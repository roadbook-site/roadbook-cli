        /* Roadbook Theme Colors */
        :root {
            --bg-paper: #f8f5f0;
            --bg-paper-dark: #eee8dc;
            --text-ink: #2d2a26;
            --accent-gold: #cfa562;
            --accent-blue: #4f46e5;
            --border-color: #e5e0d6;
        }
        
        body {
            background-color: var(--bg-paper);
            color: var(--text-ink);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        .paper-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .notebook-line {
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 100% 2rem;
        }
    </style>

        const { MapTrifold, FloppyDisk, FolderOpen, Plus, Trash, ArrowRight, CaretRight, CaretDown, Image, Path } = window;

        // API Client
        const api = {
            getConfig: () => fetch('/api/config').then(res => res.json()),
            changeDir: (path) => fetch('/api/chdir', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path })
            }).then(res => res.json()),
            list: () => fetch('/api/roadbooks').then(res => res.json()),
            get: (filename) => fetch(`/api/roadbooks/${encodeURIComponent(filename)}`).then(res => res.json()),
            save: (filename, data) => fetch(`/api/roadbooks/${encodeURIComponent(filename)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => res.json()),
            upload: async (file, currentFile) => {
                const formData = new FormData();
                formData.append('file', file);
                const url = currentFile ? `/api/upload?path=${encodeURIComponent(currentFile)}` : '/api/upload';
                const res = await fetch(url, {
                    method: 'POST',
                    body: formData,
                });
                if (!res.ok) throw new Error('Upload failed');
                return await res.json();
            }
        };

        const useLanguage = () => {
            const [lang, setLang] = useState(() => {
                const saved = localStorage.getItem('roadbook_lang');
                if (saved) return saved;
                const sys = navigator.language;
                return sys.startsWith('zh') ? 'zh' : 'en';
            });

            useEffect(() => {
                localStorage.setItem('roadbook_lang', lang);
                document.documentElement.lang = lang;
            }, [lang]);

            const t = (key) => {
                const dict = translations[lang] || translations['en'];
                return dict[key] || key;
            };

            return { lang, setLang, t };
        };

        function HelpIcon({ text }) {
            const [isOpen, setIsOpen] = useState(false);
            const tooltipRef = useRef(null);
            const contentRef = useRef(null);
            const [offset, setOffset] = useState(0);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (tooltipRef.current && !tooltipRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                };
                
                if (isOpen) {
                    document.addEventListener('mousedown', handleClickOutside);
                    
                    // Adjust position to prevent clipping by screen or scroll container
                    if (contentRef.current && tooltipRef.current) {
                        const rect = contentRef.current.getBoundingClientRect();
                        const scrollContainer = tooltipRef.current.closest('.overflow-y-auto');
                        
                        // Default bounds (viewport)
                        let minLeft = 10;
                        let maxRight = window.innerWidth - 10;
                        
                        // If inside scroll container, use its bounds
                        if (scrollContainer) {
                            const containerRect = scrollContainer.getBoundingClientRect();
                            minLeft = Math.max(minLeft, containerRect.left + 10);
                            maxRight = Math.min(maxRight, containerRect.right - 10);
                        }
                        
                        let newOffset = 0;
                        if (rect.left < minLeft) {
                            newOffset = minLeft - rect.left;
                        } else if (rect.right > maxRight) {
                            newOffset = maxRight - rect.right;
                        }
                        setOffset(newOffset);
                    }
                } else {
                    setOffset(0);
                }
                
                return () => {
                    document.removeEventListener('mousedown', handleClickOutside);
                };
            }, [isOpen]);

            if (!text) return null;
            return (
                <div 
                    ref={tooltipRef}
                    className="relative inline-flex items-center ml-1 align-middle cursor-pointer"
                    onClick={(e) => { 
                        e.stopPropagation(); 
                        e.preventDefault();
                        setIsOpen(!isOpen); 
                    }}
                >
                    <i className={`ph ph-question text-sm transition-colors ${isOpen ? 'text-blue-500' : 'text-gray-400 hover:text-blue-500'}`}></i>
                    {isOpen && (
                        <div 
                            ref={contentRef}
                            className="absolute top-full left-1/2 mt-2 w-max max-w-[260px] bg-gray-800 text-white text-xs rounded py-2 px-3 z-[100] whitespace-pre-wrap shadow-lg font-normal text-left leading-relaxed cursor-auto"
                            style={{ transform: `translateX(calc(-50% + ${offset}px))` }}
                            onClick={(e) => e.stopPropagation()}
                        >
                            <div 
                                className="absolute bottom-full border-[5px] border-transparent border-b-gray-800"
                                style={{ left: `calc(50% - ${offset}px)`, transform: 'translateX(-50%)' }}
                            ></div>
                            {text}
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const { lang, setLang, t } = useLanguage();
            // config now includes 'mode'
            const [config, setConfig] = useState({ work_dir: '', mode: '' });
            const [files, setFiles] = useState([]);
            const [currentFile, setCurrentFile] = useState(null);
            const [roadbook, setRoadbook] = useState(null);
            const [loading, setLoading] = useState(false);
            const [saving, setSaving] = useState(false);
            const [msg, setMsg] = useState(null);
            const [editingDir, setEditingDir] = useState(false);
            const [newDir, setNewDir] = useState('');

            // Check URL params on mount
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const fileToOpen = params.get('open');
                
                api.getConfig().then(cfg => {
                    setConfig(cfg);
                    setNewDir(cfg.work_dir);
                    if (cfg.language && !localStorage.getItem('roadbook_lang')) {
                        setLang(cfg.language);
                    }
                    loadFiles().then(() => {
                        if (fileToOpen) {
                            // If fileToOpen is a full path (from previous session or explicit URL),
                            // and listFiles only returns relative paths, we might need to match it.
                            // But usually listFiles output is what we care about.
                            // If the server was started with a different root, fileToOpen might be invalid now.
                            // But assuming the user just clicked a link, it's relative.
                            loadRoadbook(fileToOpen);
                        }
                    });
                });
            }, []);

            const loadFiles = () => {
                return api.list().then(data => setFiles(data.files));
            };

            const changeDirectory = () => {
                if (!newDir) return;
                api.changeDir(newDir).then(res => {
                    setConfig(prev => ({ ...prev, work_dir: res.work_dir }));
                    setEditingDir(false);
                    setFiles([]);
                    setCurrentFile(null);
                    setRoadbook(null);
                    loadFiles();
                    setMsg({ type: 'success', text: t('directory_changed') });
                }).catch(err => {
                    setMsg({ type: 'error', text: err.message });
                });
            };

            const loadRoadbook = (filename) => {
                setLoading(true);
                setCurrentFile(filename);
                // Update URL without reload
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('open', filename);
                window.history.pushState({}, '', newUrl);

                api.get(filename).then(data => {
                    setRoadbook(data);
                    setLoading(false);
                }).catch(err => {
                    console.error(err);
                    setLoading(false);
                    setMsg({ type: 'error', text: t('load_failed') + err.message });
                });
            };

            const saveRoadbook = () => {
                if (!currentFile || !roadbook) return;
                setSaving(true);
                api.save(currentFile, roadbook).then(() => {
                    setSaving(false);
                    setMsg({ type: 'success', text: t('saved') });
                    setTimeout(() => setMsg(null), 3000);
                }).catch(err => {
                    setSaving(false);
                    setMsg({ type: 'error', text: t('save_failed') + err.message });
                });
            };

            const updateMeta = (key, value) => {
                setRoadbook(prev => ({
                    ...prev,
                    meta: { ...prev.meta, [key]: value }
                }));
            };

            const updateSheet = (index, newSheet) => {
                const newSheets = [...roadbook.sheets];
                newSheets[index] = newSheet;
                setRoadbook(prev => ({ ...prev, sheets: newSheets }));
            };
            
            const addSheet = (insertAfterIndex = null) => {
                let newId;
                do {
                    newId = Math.random().toString(36).substring(2, 7);
                } while (roadbook.sheets.some(s => s.id === newId));

                const newSheet = {
                    title: t('new_page_title'),
                    id: newId,
                    steps: [],
                    extra_content: ""
                };
                
                setRoadbook(prev => {
                    const newSheets = [...prev.sheets];
                    if (insertAfterIndex !== null && insertAfterIndex >= 0 && insertAfterIndex < newSheets.length) {
                        newSheets.splice(insertAfterIndex + 1, 0, newSheet);
                    } else {
                        newSheets.push(newSheet);
                    }
                    return { ...prev, sheets: newSheets };
                });
            };

            const deleteSheet = (index) => {
                if(!confirm(t('confirm_delete_sheet'))) return;
                const newSheets = [...roadbook.sheets];
                newSheets.splice(index, 1);
                setRoadbook(prev => ({ ...prev, sheets: newSheets }));
            };

            const moveSheet = (fromIndex, toIndex) => {
                if (fromIndex === toIndex || toIndex < 0 || toIndex >= roadbook.sheets.length) return;
                setRoadbook(prev => {
                    const newSheets = [...prev.sheets];
                    const [draggedSheet] = newSheets.splice(fromIndex, 1);
                    newSheets.splice(toIndex, 0, draggedSheet);
                    return { ...prev, sheets: newSheets };
                });
            };

            const [globalCollapseSignal, setGlobalCollapseSignal] = useState({ id: 0, collapsed: false });

            const expandAll = () => setGlobalCollapseSignal({ id: Date.now(), collapsed: false });
            const collapseAll = () => setGlobalCollapseSignal({ id: Date.now(), collapsed: true });

            return (
                <div className="flex h-full text-sm">
                    {/* Sidebar */}
                    <div className="w-64 bg-[#eee8dc] border-r border-[#e5e0d6] flex flex-col shadow-inner">
                        <div className="p-4 border-b border-[#e5e0d6]">
                            <div className="flex items-center justify-between mb-1">
                                <div className="flex items-center space-x-2 text-[#2d2a26] font-bold text-lg">
                                    <i className="ph ph-map-trifold text-xl"></i>
                                    <span>{t('title')}</span>
                                </div>
                                <button 
                                    onClick={() => setLang(lang === 'en' ? 'zh' : 'en')}
                                    className="text-xs font-bold px-2 py-1 rounded bg-white/50 hover:bg-white border border-transparent hover:border-gray-200 transition-colors uppercase"
                                    title={t('language')}
                                >
                                    {lang === 'en' ? 'EN' : '中'}
                                </button>
                            </div>
                            
                            {/* Directory Switcher / Mode Info */}
                            <div className="mt-4">
                                <div className="flex items-center justify-between mb-1">
                                    <div className="text-xs text-gray-500 font-medium uppercase tracking-wider">{t('workspace')}</div>
                                    {config.mode && (
                                        <span className="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded border border-blue-200 truncate max-w-[100px]" title={config.mode}>
                                            {config.mode}
                                        </span>
                                    )}
                                </div>
                                {editingDir ? (
                                    <div className="flex items-center space-x-1">
                                        <input 
                                            type="text" 
                                            value={newDir}
                                            onChange={e => setNewDir(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && changeDirectory()}
                                            className="w-full text-xs px-2 py-1 border rounded bg-white"
                                            autoFocus
                                        />
                                        <button onClick={changeDirectory} className="text-blue-600">✓</button>
                                        <button onClick={() => setEditingDir(false)} className="text-gray-500">✕</button>
                                    </div>
                                ) : (
                                    <div 
                                        className="text-xs text-gray-700 bg-white/50 px-2 py-1 rounded cursor-pointer hover:bg-white truncate border border-transparent hover:border-gray-300 transition-colors"
                                        onClick={() => setEditingDir(true)}
                                        title={config.work_dir}
                                    >
                                        {config.work_dir ? config.work_dir.split(/[\\/]/).pop() : '...'}
                                    </div>
                                )}
                            </div>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-2 space-y-1">
                            {files.length === 0 && (
                                <div className="text-center text-gray-400 mt-10 text-xs">
                                    {t('no_roadbooks')}<br/>{t('create_via_cli')}
                                </div>
                            )}
                            {files.map(file => (
                                <div 
                                    key={file} 
                                    onClick={() => loadRoadbook(file)}
                                    className={`px-3 py-2 rounded-lg cursor-pointer flex items-center space-x-2 transition-all ${
                                        currentFile === file 
                                        ? 'bg-white shadow text-blue-600 font-medium' 
                                        : 'hover:bg-white/60 text-gray-700'
                                    }`}
                                >
                                    <i className="ph ph-book-bookmark text-lg opacity-70"></i>
                                    <span className="truncate">{file}</span>
                                </div>
                            ))}
                        </div>
                        
                        <div className="p-4 border-t border-[#e5e0d6] text-xs text-gray-400 text-center">
                            {t('protocol')}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col bg-[#f8f5f0] h-full overflow-hidden relative">
                        {/* Header */}
                        <div className="h-16 bg-white/80 backdrop-blur border-b border-[#e5e0d6] px-8 flex items-center justify-between shadow-sm z-10 shrink-0">
                            <div>
                                <h1 className="font-serif font-bold text-xl text-[#2d2a26] flex items-center">
                                    {roadbook ? roadbook.meta.name || t('untitled') : t('welcome')}
                                </h1>
                                {currentFile && (
                                    <div className="text-xs text-gray-400 mt-0.5 font-mono" title={currentFile}>
                                        {currentFile}
                                    </div>
                                )}
                            </div>
                            
                            <div className="flex items-center space-x-4">
                                {msg && (
                                    <span className={`text-sm px-3 py-1 rounded-full ${msg.type === 'error' ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`}>
                                        {msg.text}
                                    </span>
                                )}
                                <button 
                                    onClick={saveRoadbook} 
                                    disabled={!currentFile || saving}
                                    className={`flex items-center space-x-2 px-5 py-2 rounded-lg text-white font-medium transition-all shadow-md active:scale-95 ${
                                        !currentFile ? 'bg-gray-300 cursor-not-allowed' : 
                                        saving ? 'bg-blue-400' : 'bg-[#2d2a26] hover:bg-black'
                                    }`}
                                >
                                    <i className="ph ph-floppy-disk text-lg"></i>
                                    <span>{saving ? t('saving') : t('save')}</span>
                                </button>
                            </div>
                        </div>

                        {/* Editor Area - Fixed Scrolling */}
                        <div className="flex-1 overflow-y-auto p-8 scroll-smooth">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center h-64 text-gray-400">
                                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-400 mb-4"></div>
                                    <span>{t('loading')}</span>
                                </div>
                            ) : roadbook ? (
                                <div className="max-w-4xl mx-auto space-y-10 pb-32">
                                    
                                    {/* Meta Section */}
                                    <div className="bg-white rounded-xl shadow-sm border border-[#e5e0d6] p-8 relative overflow-hidden group">
                                        <div className="absolute top-0 left-0 w-1 h-full bg-[#2d2a26]"></div>
                                        <div className="absolute top-4 right-4 opacity-10 text-6xl text-gray-400 font-serif font-bold pointer-events-none">META</div>
                                        
                                        <div className="grid grid-cols-12 gap-6">
                                            <div className="col-span-12 mb-2">
                                                <h2 className="text-lg font-bold text-gray-800 border-b-2 border-gray-100 pb-2 inline-block">{t('base_info')}</h2>
                                            </div>
                                            
                                            <Field label="ID" value={roadbook.meta.id} onChange={v => updateMeta('id', v)} readOnly col="col-span-4" />
                                            <Field label="Name" value={roadbook.meta.name} onChange={v => updateMeta('name', v)} required col="col-span-6" />
                                            <Field label="Ver" value={roadbook.meta.version} onChange={v => updateMeta('version', v)} required col="col-span-2" />
                                            
                                            <Field label={t('description')} value={roadbook.meta.description} onChange={v => updateMeta('description', v)} col="col-span-12" textarea />
                                            
                                            <TextListEditor 
                                                key={`inputs-${roadbook.meta.id}`}
                                                label={t('inputs')} 
                                                value={roadbook.meta.inputs} 
                                                onChange={v => updateMeta('inputs', v)} 
                                                col="col-span-12" 
                                                placeholder="keyword: Search Keyword..."
                                            />
                                            <TextListEditor 
                                                key={`outputs-${roadbook.meta.id}`}
                                                label={t('outputs')} 
                                                value={roadbook.meta.outputs} 
                                                onChange={v => updateMeta('outputs', v)} 
                                                col="col-span-12"
                                                placeholder="order_id: The order ID..."
                                            />
                                        </div>
                                    </div>

                                    {/* Sheets Section */}
                                    <div className="space-y-8">
                                        <div className="flex items-center justify-between px-2 border-b border-gray-200 pb-4">
                                            <h2 className="text-2xl font-serif font-bold text-[#2d2a26]">{t('sheets')}</h2>
                                            <div className="flex items-center space-x-2">
                                                <button 
                                                    onClick={expandAll} 
                                                    className="flex items-center space-x-1 text-gray-500 hover:text-gray-800 font-medium px-3 py-1.5 rounded hover:bg-gray-100 transition-colors"
                                                    title={t('expand_all')}
                                                >
                                                    <i className="ph ph-arrows-out-line-vertical text-lg"></i>
                                                    <span className="text-xs">{t('expand_all')}</span>
                                                </button>
                                                <button 
                                                    onClick={collapseAll} 
                                                    className="flex items-center space-x-1 text-gray-500 hover:text-gray-800 font-medium px-3 py-1.5 rounded hover:bg-gray-100 transition-colors"
                                                    title={t('collapse_all')}
                                                >
                                                    <i className="ph ph-arrows-in-line-vertical text-lg"></i>
                                                    <span className="text-xs">{t('collapse_all')}</span>
                                                </button>
                                            </div>
                                        </div>
                                        
                                        {roadbook.sheets.map((sheet, idx) => (
                                            <SheetEditor 
                                                key={sheet.id || idx} 
                                                index={idx}
                                                totalSheets={roadbook.sheets.length}
                                                sheet={sheet} 
                                                currentFile={currentFile}
                                                onChange={(newSheet) => updateSheet(idx, newSheet)}
                                                onDelete={() => deleteSheet(idx)}
                                                onMove={(toIndex) => moveSheet(idx, toIndex)}
                                                onInsertAfter={() => addSheet(idx)}
                                                globalCollapseSignal={globalCollapseSignal}
                                                t={t}
                                            />
                                        ))}
                                        
                                        <div className="py-10 text-center">
                                            <button onClick={() => addSheet()} className="text-gray-400 hover:text-blue-600 transition-colors flex flex-col items-center mx-auto space-y-2 group">
                                                <div className="w-12 h-12 rounded-full border-2 border-dashed border-gray-300 group-hover:border-blue-400 flex items-center justify-center">
                                                    <i className="ph ph-plus text-xl"></i>
                                                </div>
                                                <span className="text-sm">{t('continue_writing')}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex flex-col items-center justify-center h-full text-gray-400">
                                    <i className="ph ph-book-open text-6xl mb-4 opacity-20"></i>
                                    <p>{t('select_roadbook')}</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Field({ label, value, onChange, required, col, textarea, placeholder, readOnly, height, tooltip }) {
            return (
                <div className={`${col || 'col-span-12'}`}>
                    <label className="flex items-center text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">
                        <span>{label}</span>
                        {required && <span className="text-red-400 ml-1">*</span>}
                        {tooltip && <HelpIcon text={tooltip} />}
                    </label>
                    {textarea ? (
                        <textarea 
                            value={value || ''} 
                            onChange={e => onChange(e.target.value)}
                            readOnly={readOnly}
                            className={`w-full border border-gray-200 rounded-lg px-3 py-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all resize-none ${height || 'h-24'} ${readOnly ? 'bg-gray-100 cursor-not-allowed text-gray-500' : 'bg-gray-50'}`}
                            placeholder={placeholder}
                        />
                    ) : (
                        <input 
                            type="text" 
                            value={value || ''} 
                            onChange={e => onChange(e.target.value)}
                            readOnly={readOnly}
                            className={`w-full border border-gray-200 rounded-lg px-3 py-2 text-gray-800 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all ${readOnly ? 'bg-gray-100 cursor-not-allowed text-gray-500' : 'bg-gray-50'}`}
                            placeholder={placeholder}
                        />
                    )}
                </div>
            );
        }

        function TextListEditor({ label, value, onChange, col, placeholder, tooltip }) {
            const format = (val) => {
                if (!val) return '';
                return Object.entries(val).map(([k, v]) => `${k}: ${v}`).join('\n');
            };
            
            const parse = (str) => {
                const res = {};
                str.split('\n').forEach(line => {
                    const idx = line.indexOf(':');
                    if (idx > 0) {
                        const k = line.substring(0, idx).trim();
                        const v = line.substring(idx + 1).trim();
                        if(k) res[k] = v;
                    }
                });
                return res;
            };

            const [text, setText] = useState(() => format(value));
            
            return (
                <div className={`${col || 'col-span-12'}`}>
                    <label className="flex items-center text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">
                        <span>{label}</span>
                        {tooltip && <HelpIcon text={tooltip} />}
                    </label>
                    <textarea 
                        value={text} 
                        onChange={e => {
                            setText(e.target.value);
                            onChange(parse(e.target.value));
                        }}
                        className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-800 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none bg-gray-50 transition-all resize-none h-24 font-mono leading-relaxed placeholder-gray-400"
                        placeholder={placeholder || "key: description..."}
                    />
                </div>
            );
        }

        function SheetEditor({ index, totalSheets, sheet, currentFile, onChange, onDelete, onMove, onInsertAfter, globalCollapseSignal, t }) {
            const [isCollapsed, setIsCollapsed] = useState(false);
            const [draggedIdx, setDraggedIdx] = useState(null);
            const [dragOverIdx, setDragOverIdx] = useState(null);
            const [uploadingImage, setUploadingImage] = useState(false);
            const [showImageModal, setShowImageModal] = useState(false);
            const [showAnnotator, setShowAnnotator] = useState(false);

            useEffect(() => {
                if (globalCollapseSignal && globalCollapseSignal.id > 0) {
                    setIsCollapsed(globalCollapseSignal.collapsed);
                }
            }, [globalCollapseSignal]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && showImageModal) {
                        setShowImageModal(false);
                    }
                };
                if (showImageModal) {
                    document.addEventListener('keydown', handleKeyDown);
                }
                return () => document.removeEventListener('keydown', handleKeyDown);
            }, [showImageModal]);

            const updateField = (key, value) => {
                onChange({ ...sheet, [key]: value });
            };

            const updateStep = (idx, newStep) => {
                const newSteps = [...sheet.steps];
                newSteps[idx] = newStep;
                onChange({ ...sheet, steps: newSteps });
            };

            const addStep = () => {
                onChange({
                    ...sheet,
                    steps: [...sheet.steps, { action: 'CLICK', selector: '', value: '', original_text: 'CLICK ""' }]
                });
            };

            const insertStep = (idx) => {
                const newSteps = [...sheet.steps];
                newSteps.splice(idx + 1, 0, { action: 'CLICK', selector: '', value: '', original_text: 'CLICK ""' });
                onChange({ ...sheet, steps: newSteps });
            };
            
            const removeStep = (idx) => {
                const newSteps = [...sheet.steps];
                newSteps.splice(idx, 1);
                onChange({ ...sheet, steps: newSteps });
            };

            const handleDragStart = (e, idx) => {
                setDraggedIdx(idx);
                e.dataTransfer.effectAllowed = "move";
                // 使用 setTimeout 让拖拽的本体变半透明，而不是原地的元素
                setTimeout(() => e.target.classList.add('opacity-40'), 0);
            };

            const handleDragEnd = (e) => {
                e.target.classList.remove('opacity-40');
                setDraggedIdx(null);
                setDragOverIdx(null);
            };

            const handleDragOver = (e, idx) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                if (draggedIdx === null || draggedIdx === idx) return;
                
                // 计算鼠标是在元素的上半部分还是下半部分
                const rect = e.currentTarget.getBoundingClientRect();
                const midY = rect.top + rect.height / 2;
                const isBottomHalf = e.clientY > midY;
                
                // 决定插入的视觉位置
                if (isBottomHalf) {
                    setDragOverIdx(idx + 1);
                } else {
                    setDragOverIdx(idx);
                }
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
            };

            const handleDrop = (e, idx) => {
                e.preventDefault();
                if (draggedIdx === null) return;
                
                const targetIdx = dragOverIdx !== null ? dragOverIdx : idx;
                
                if (draggedIdx === targetIdx || draggedIdx === targetIdx - 1) {
                    setDraggedIdx(null);
                    setDragOverIdx(null);
                    return;
                }
                
                const newSteps = [...sheet.steps];
                const draggedStep = newSteps[draggedIdx];
                newSteps.splice(draggedIdx, 1);
                
                // 调整插入位置，因为删除了一个元素后，后面的索引会前移
                let finalInsertIdx = targetIdx;
                if (draggedIdx < targetIdx) {
                    finalInsertIdx -= 1;
                }
                
                newSteps.splice(finalInsertIdx, 0, draggedStep);
                
                onChange({ ...sheet, steps: newSteps });
                setDraggedIdx(null);
                setDragOverIdx(null);
            };

            const handlePaste = async (e) => {
                const items = e.clipboardData ? e.clipboardData.items : null;
                if (!items) return;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        e.preventDefault();
                        const file = items[i].getAsFile();
                        const ext = file.name.split('.').pop() || 'png';
                        const newName = `img_${Math.random().toString(36).substring(2, 8)}.${ext}`;
                        const renamedFile = new File([file], newName, { type: file.type });
                        
                        setUploadingImage(true);
                        try {
                            const res = await api.upload(renamedFile, currentFile);
                            updateField('reference', `![Image](${res.url})`);
                        } catch (err) {
                            alert(t('image_upload_failed') + err.message);
                        } finally {
                            setUploadingImage(false);
                        }
                        break;
                    }
                }
            };

            let previewUrl = '';
            if (sheet.reference) {
                const match = sheet.reference.match(/\((.*?)\)/);
                if (match) {
                    let extractedUrl = match[1];
                    
                    if (extractedUrl.startsWith('http://') || extractedUrl.startsWith('https://')) {
                        previewUrl = extractedUrl;
                    } else if (extractedUrl.startsWith('/')) {
                        previewUrl = extractedUrl;
                    } else {
                        // Relative path logic
                        // If currentFile is absolute (e.g. C:/Users/zds/...), baseDir is C:/Users/zds/...
                        let baseDir = '';
                        if (currentFile && currentFile.includes('/')) {
                            baseDir = currentFile.substring(0, currentFile.lastIndexOf('/') + 1);
                        }
                        
                        let cleanUrl = extractedUrl;
                        if (cleanUrl.startsWith('./')) {
                            cleanUrl = cleanUrl.substring(2);
                        }
                        
                        // We use encodeURIComponent for the *whole* path after /api/files/ to be safe
                        // BUT fastapi {filepath:path} expects raw slashes.
                        // If we encode slashes (%2F), fastapi might treat it as single segment.
                        // Standard practice: /api/files/path/to/file
                        // So we should NOT encode slashes.
                        // But we SHOULD encode special chars?
                        // Browser automatically encodes spaces to %20.
                        // Windows drive colon c: -> c: is valid in path usually.
                        
                        // Fix for absolute paths starting with drive letter (e.g. C:/...)
                        // If we just concat, we get /api/files/C:/... 
                        // This should work in modern browsers/servers.
                        
                        previewUrl = `/api/files/${baseDir}${cleanUrl}`;
                    }
                }
            }

            return (
                <div className="bg-white rounded-xl shadow-sm border border-[#e5e0d6] transition-all hover:shadow-md group">
                    {/* Sheet Header */}
                    <div 
                        className="bg-gradient-to-r from-gray-50 to-white rounded-t-xl px-6 py-4 border-b border-[#e5e0d6] flex justify-between items-center cursor-pointer select-none"
                        onClick={() => setIsCollapsed(!isCollapsed)}
                    >
                        <div className="flex items-center space-x-4 flex-1">
                            <select
                                value={index}
                                onClick={(e) => e.stopPropagation()}
                                onChange={(e) => {
                                    const newIdx = parseInt(e.target.value, 10);
                                    if (!isNaN(newIdx) && newIdx >= 0 && newIdx < totalSheets) {
                                        onMove(newIdx);
                                    }
                                }}
                                className="w-8 h-8 rounded-full bg-[#2d2a26] hover:bg-blue-600 text-white flex items-center justify-center font-serif font-bold shrink-0 transition-colors appearance-none cursor-pointer outline-none"
                                title={t('move_sheet')}
                                style={{ textAlignLast: 'center' }}
                            >
                                {Array.from({ length: totalSheets }, (_, i) => (
                                    <option key={i} value={i} className="bg-white text-black text-center">{i + 1}</option>
                                ))}
                            </select>
                            <div className="flex-1 flex flex-col">
                                <div className="flex items-center w-full pr-4">
                                    <input 
                                        type="text" 
                                        value={sheet.title} 
                                        onChange={e => { e.stopPropagation(); updateField('title', e.target.value); }}
                                        className="flex-1 font-bold text-lg bg-transparent border-none focus:ring-0 p-0 placeholder-gray-400 text-[#2d2a26]"
                                        placeholder={t('sheet_title_placeholder')}
                                        onClick={e => e.stopPropagation()}
                                    />
                                    <HelpIcon text={t('tooltip_title')} />
                                </div>
                                <div className="text-xs text-gray-400 mt-0.5 font-mono flex items-center">
                                    <span>ID: {sheet.id || 'N/A'}</span>
                                    {sheet.id && (
                                        <button 
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                navigator.clipboard.writeText(sheet.id);
                                                // Optional: provide some visual feedback? 
                                                // For now, simple copy is fine.
                                            }}
                                            className="ml-2 hover:text-blue-500 transition-colors focus:outline-none"
                                            title={t('copy_id')}
                                        >
                                            <i className="ph ph-copy"></i>
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                        <div className="flex items-center space-x-3">
                            <button 
                                onClick={(e) => { e.stopPropagation(); onDelete(); }} 
                                className="w-8 h-8 rounded-full hover:bg-red-50 text-gray-300 hover:text-red-500 flex items-center justify-center transition-colors"
                                title={t('delete_sheet')}
                            >
                                <i className="ph ph-trash text-lg"></i>
                            </button>
                            <i className={`ph ph-caret-down text-gray-400 transition-transform ${isCollapsed ? '-rotate-90' : ''}`}></i>
                        </div>
                    </div>

                    {/* Sheet Body */}
                    {!isCollapsed && (
                        <div className="p-6 space-y-6">
                            <div className="grid grid-cols-12 gap-6">
                                <div className="col-span-3">
                                    <label className="flex items-center text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">
                                        <span>{t('type_optional')}</span>
                                        <HelpIcon text={t('tooltip_type')} />
                                    </label>
                                    <div className="relative">
                                        <select 
                                            value={sheet.type || 'process'} 
                                            onChange={e => updateField('type', e.target.value)}
                                            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-gray-800 bg-gray-50 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all appearance-none cursor-pointer"
                                        >
                                            <option value="process">process</option>
                                            <option value="setup">setup</option>
                                            <option value="delivery">delivery</option>
                                            <option value="crossroads">crossroads</option>
                                        </select>
                                        <div className="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none text-gray-500">
                                            <i className="ph ph-caret-down"></i>
                                        </div>
                                    </div>
                                </div>
                                
                                <Field 
                                    label={t('url_optional')} 
                                    value={sheet.url} 
                                    onChange={v => updateField('url', v)} 
                                    placeholder={t('url_placeholder')}
                                    col="col-span-9"
                                    tooltip={t('tooltip_url')}
                                />
                                  
                                {sheet.type === 'setup' && (
                                    <TextListEditor
                                        key={`constraints-${sheet.id}`}
                                        label={t('constraints')}
                                        value={sheet.constraints || {}}
                                        onChange={v => updateField('constraints', v)}
                                        col="col-span-12"
                                        placeholder="force_headful: true&#10;stealth_mode: true&#10;viewport: 1920x1080"
                                        tooltip={t('tooltip_constraints')}
                                    />
                                )}
                            </div>

                            <Field
                                label={t('description_goal')}
                                value={sheet.description}
                                onChange={v => updateField('description', v)}
                                textarea
                                placeholder={t('description_placeholder')}
                                tooltip={t('tooltip_desc')}
                            />
                            
                            {/* Reference Image */}
                            <div className="bg-gray-50 rounded-lg p-4 border border-dashed border-gray-300" onPaste={handlePaste}>
                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 flex items-center justify-between">
                                    <div className="flex items-center">
                                        <span>{t('reference_image')}</span>
                                        <HelpIcon text={t('tooltip_ref')} />
                                    </div>
                                    {uploadingImage && <span className="text-blue-500 normal-case text-xs"><i className="ph ph-spinner animate-spin inline-block mr-1"></i>{t('uploading')}</span>}
                                </label>
                                <div className="flex flex-col space-y-3">
                                    {previewUrl && (
                                        <div className="w-full bg-white rounded overflow-hidden relative border border-gray-300 shadow-sm transition-all hover:shadow-md group text-center">
                                            <img 
                                                src={previewUrl} 
                                                className="max-h-80 mx-auto object-contain cursor-zoom-in"
                                                onError={(e) => e.target.style.display = 'none'} 
                                                onClick={() => setShowImageModal(true)}
                                                title={t('click_to_zoom')}
                                            />
                                            {/* Annotate / Delete Buttons Overlay */}
                                            <div className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity flex space-x-1">
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); setShowAnnotator(true); }}
                                                    className="bg-black/50 hover:bg-black/70 text-white p-1.5 rounded backdrop-blur-sm shadow-sm"
                                                    title={t('annotate')}
                                                >
                                                    <i className="ph ph-pencil-simple text-lg"></i>
                                                </button>
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); updateField('reference', ''); }}
                                                    className="bg-black/50 hover:bg-red-600/80 text-white p-1.5 rounded backdrop-blur-sm shadow-sm"
                                                    title={t('delete_image')}
                                                >
                                                    <i className="ph ph-trash text-lg"></i>
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                    <div className="w-full">
                                        <input 
                                            type="text" 
                                            value={sheet.reference || ''} 
                                            onChange={e => updateField('reference', e.target.value)}
                                            className="w-full border border-gray-300 rounded px-3 py-2 text-sm font-mono text-gray-600 mb-1"
                                            placeholder={t('paste_placeholder')}
                                        />
                                        <p className="text-xs text-gray-400">{t('paste_hint')}</p>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Annotator Modal */}
                            {showAnnotator && previewUrl && (
                                <ImageAnnotator 
                                    imageUrl={previewUrl}
                                    t={t}
                                    onClose={() => setShowAnnotator(false)}
                                    onSave={async (file) => {
                                        setUploadingImage(true);
                                        try {
                                            const res = await api.upload(file, currentFile);
                                            updateField('reference', `![Annotated](${res.url})`);
                                            setShowAnnotator(false);
                                        } catch (err) {
                                            alert(t('image_upload_failed') + err.message);
                                        } finally {
                                            setUploadingImage(false);
                                        }
                                    }}
                                />
                            )}

                            {/* Fullscreen Image Modal */}
                            {showImageModal && previewUrl && (
                                <div 
                                    className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-8"
                                    onClick={() => setShowImageModal(false)}
                                >
                                    <div className="relative max-w-full max-h-full">
                                        <img 
                                            src={previewUrl} 
                                            className="max-w-full max-h-[90vh] object-contain rounded shadow-2xl"
                                            onClick={(e) => e.stopPropagation()}
                                        />
                                        <button 
                                            className="absolute -top-12 right-0 text-white/70 hover:text-white transition-colors"
                                            onClick={() => setShowImageModal(false)}
                                            title={t('close_preview')}
                                        >
                                            <i className="ph ph-x text-3xl"></i>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Steps */}
                            <div>
                                <div className="flex items-center justify-between mb-3">
                                    <label className="flex items-center text-xs font-bold text-gray-500 uppercase tracking-wider">
                                        <span>{t('action_steps')}</span>
                                        <HelpIcon text={t('tooltip_steps')} />
                                    </label>
                                </div>
                                <div className="space-y-2 relative">
                                    {sheet.steps.map((step, idx) => (
                                        <React.Fragment key={idx}>
                                            {/* 拖拽时的顶部占位符 */}
                                            {dragOverIdx === idx && (
                                                <div className="h-1 bg-blue-400 rounded-full my-1 transition-all"></div>
                                            )}
                                            <StepEditor 
                                                index={idx} 
                                                step={step} 
                                                isDragging={draggedIdx === idx}
                                                onChange={(s) => updateStep(idx, s)} 
                                                onRemove={() => removeStep(idx)}
                                                onInsert={() => insertStep(idx)}
                                                onDragStart={(e) => handleDragStart(e, idx)}
                                                onDragOver={(e) => handleDragOver(e, idx)}
                                                onDragLeave={handleDragLeave}
                                                onDrop={(e) => handleDrop(e, idx)}
                                                onDragEnd={handleDragEnd}
                                                t={t}
                                            />
                                        </React.Fragment>
                                    ))}
                                    {/* 拖拽到最后的底部占位符 */}
                                    {dragOverIdx === sheet.steps.length && (
                                        <div className="h-1 bg-blue-400 rounded-full my-1 transition-all"></div>
                                    )}
                                    
                                    <button 
                                        onClick={addStep}
                                        className="w-full py-3 border-2 border-dashed border-gray-200 rounded-lg text-gray-400 hover:border-blue-400 hover:text-blue-500 hover:bg-blue-50 text-sm font-medium transition-all flex items-center justify-center space-x-2"
                                    >
                                        <i className="ph ph-plus"></i>
                                        <span>{t('add_action_step')}</span>
                                    </button>
                                </div>
                            </div>

                            <div className="flex justify-end pt-4 border-t border-gray-100 mt-6">
                                <button 
                                    onClick={onInsertAfter}
                                    className="text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-2 transition-colors"
                                >
                                    <i className="ph ph-plus-circle text-lg"></i>
                                    <span>{t('insert_sheet_below')}</span>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StepEditor({ index, step, isDragging, onChange, onRemove, onInsert, onDragStart, onDragOver, onDragLeave, onDrop, onDragEnd, t }) {
            const [draggable, setDraggable] = useState(false);
            return (
                <div 
                    draggable={draggable}
                    onDragStart={onDragStart}
                    onDragOver={onDragOver}
                    onDragLeave={onDragLeave}
                    onDrop={onDrop}
                    onDragEnd={(e) => {
                        setDraggable(false);
                        if (onDragEnd) onDragEnd(e);
                    }}
                    className={`flex items-center space-x-3 group bg-white border rounded-lg p-2 transition-all ${
                        isDragging ? 'opacity-40 border-dashed border-gray-400 scale-[0.98]' : 'border-gray-200 hover:border-blue-300 hover:shadow-sm'
                    }`}
                >
                    <div 
                        onMouseEnter={() => setDraggable(true)}
                        onMouseLeave={() => setDraggable(false)}
                        className="cursor-grab text-gray-300 hover:text-gray-600 px-1 opacity-0 group-hover:opacity-100" 
                        title={t('drag_sort')}
                    >
                        <i className="ph ph-dots-six-vertical text-lg"></i>
                    </div>
                    <span className="text-gray-400 font-mono w-4 text-center text-xs">{index + 1}.</span>
                    <input 
                        type="text" 
                        value={step.original_text || ''} 
                        onChange={e => onChange({ ...step, original_text: e.target.value })}
                        className="flex-1 bg-transparent border-none p-0 font-mono text-sm text-[#2d2a26] focus:ring-0 placeholder-gray-300"
                        placeholder={t('step_placeholder')}
                    />
                    <div className="opacity-0 group-hover:opacity-100 flex items-center space-x-1 px-1">
                        <button 
                            onClick={onInsert}
                            className="text-gray-300 hover:text-blue-500 transition-colors p-1"
                            title={t('insert_before')}
                        >
                            <i className="ph ph-plus"></i>
                        </button>
                        <button 
                            onClick={onRemove}
                            className="text-gray-300 hover:text-red-500 transition-colors p-1"
                            title={t('delete_step')}
                        >
                            <i className="ph ph-x"></i>
                        </button>
                    </div>
                </div>
            );
        }

        function ImageAnnotator({ imageUrl, onSave, onClose, t }) {
            const canvasEl = useRef(null);
            const fabricCanvas = useRef(null);
            const [tool, setTool] = useState('select'); 
            const [color, setColor] = useState('#ef4444');
            const [isSaving, setIsSaving] = useState(false);
            const [canvasSize, setCanvasSize] = useState({ width: 800, height: 600 });
            
            // Undo History
            const history = useRef([]);
            const historyProcessing = useRef(false);

            // Initialize Fabric
            useEffect(() => {
                if (!canvasEl.current || !window.fabric) return;
                
                const canvas = new fabric.Canvas(canvasEl.current, {
                    selection: true,
                    isDrawingMode: false
                });
                fabricCanvas.current = canvas;
                
                // History Logic
                const saveHistory = () => {
                    if (historyProcessing.current) return;
                    const json = JSON.stringify(canvas.toJSON());
                    history.current.push(json);
                    if (history.current.length > 20) history.current.shift();
                };

                canvas.on('object:added', saveHistory);
                canvas.on('object:modified', saveHistory);
                canvas.on('object:removed', saveHistory);
                
                // Load Image
                fabric.Image.fromURL(imageUrl, (img) => {
                    if(!img) return;
                    
                    // Fit image to screen (leave space for toolbar)
                    const maxW = window.innerWidth - 100;
                    const maxH = window.innerHeight - 150;
                    
                    let scale = 1;
                    if (img.width > maxW || img.height > maxH) {
                        scale = Math.min(maxW / img.width, maxH / img.height);
                    }
                    
                    const width = img.width * scale;
                    const height = img.height * scale;
                    
                    setCanvasSize({ width, height });
                    canvas.setWidth(width);
                    canvas.setHeight(height);
                    
                    // Set image as background
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                        scaleX: scale,
                        scaleY: scale
                    });
                    
                    // Save initial state
                    saveHistory();
                }, { crossOrigin: 'anonymous' });

                return () => {
                    canvas.dispose();
                };
            }, [imageUrl]);
            
            // Tool Switching logic
            useEffect(() => {
                const canvas = fabricCanvas.current;
                if (!canvas) return;
                
                canvas.isDrawingMode = (tool === 'pencil');
                if (tool === 'pencil') {
                    canvas.freeDrawingBrush.color = color;
                    canvas.freeDrawingBrush.width = 5;
                }
            }, [tool, color]);

            const undo = () => {
                const canvas = fabricCanvas.current;
                if (!canvas || history.current.length <= 1) return;
                
                historyProcessing.current = true;
                history.current.pop(); // Remove current state
                const prevState = history.current[history.current.length - 1];
                
                canvas.loadFromJSON(prevState, () => {
                    canvas.renderAll();
                    historyProcessing.current = false;
                });
            };
            
            const addArrow = () => {
                const canvas = fabricCanvas.current;
                const triangle = new fabric.Triangle({
                    width: 20, height: 20, fill: color, left: 50, top: 0, angle: 90, originX: 'center', originY: 'center'
                });
                const line = new fabric.Rect({
                    left: 0, top: 0, width: 100, height: 5, fill: color, originX: 'center', originY: 'center'
                });
                const group = new fabric.Group([line, triangle], {
                    left: canvas.width / 2, top: canvas.height / 2, angle: 0
                });
                canvas.add(group);
                canvas.setActiveObject(group);
                setTool('select');
            };

            const addRect = () => {
                const canvas = fabricCanvas.current;
                const rect = new fabric.Rect({
                    left: canvas.width / 2, top: canvas.height / 2,
                    width: 100, height: 100,
                    fill: 'transparent', stroke: color, strokeWidth: 5,
                    originX: 'center', originY: 'center'
                });
                canvas.add(rect);
                canvas.setActiveObject(rect);
                setTool('select');
            };

            const addCircle = () => {
                const canvas = fabricCanvas.current;
                const circle = new fabric.Circle({
                    left: canvas.width / 2, top: canvas.height / 2,
                    radius: 50,
                    fill: 'transparent', stroke: color, strokeWidth: 5,
                    originX: 'center', originY: 'center'
                });
                canvas.add(circle);
                canvas.setActiveObject(circle);
                setTool('select');
            };
            
            const addText = () => {
                const canvas = fabricCanvas.current;
                const text = new fabric.IText('Text', {
                    left: canvas.width / 2, top: canvas.height / 2,
                    fontFamily: 'arial', fill: color, fontSize: 24,
                    originX: 'center', originY: 'center'
                });
                canvas.add(text);
                canvas.setActiveObject(text);
                setTool('select');
            };

            const deleteSelected = () => {
                 const canvas = fabricCanvas.current;
                 const active = canvas.getActiveObject();
                 if (active) canvas.remove(active);
            }
            
            useEffect(() => {
                const handleKey = (e) => {
                    if (e.key === 'Delete' || e.key === 'Backspace') {
                        // Check if we are editing text
                        const canvas = fabricCanvas.current;
                        if (canvas && canvas.getActiveObject() && !canvas.getActiveObject().isEditing) {
                             deleteSelected();
                        }
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                        e.preventDefault();
                        undo();
                    }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, []);

            const save = () => {
                if (!fabricCanvas.current) return;
                setIsSaving(true);
                // Reset zoom/pan before saving to get full image? 
                // Currently we fit image to canvas, so toDataURL gets what we see.
                // But the original image might be larger. 
                // For simplicity, we save at current canvas resolution.
                const dataURL = fabricCanvas.current.toDataURL({ format: 'png', quality: 1 });
                
                fetch(dataURL)
                .then(res => res.blob())
                .then(blob => {
                    const file = new File([blob], "annotated.png", { type: "image/png" });
                    onSave(file);
                    setIsSaving(false);
                });
            };

            return (
                <div className="fixed inset-0 z-[200] bg-[#2d2a26] flex flex-col">
                    {/* Toolbar */}
                    <div className="h-16 bg-[#1a1816] px-4 flex items-center justify-between shrink-0">
                        <div className="flex items-center space-x-4">
                            <button onClick={onClose} className="text-gray-400 hover:text-white px-3 py-1 rounded">
                                <i className="ph ph-x text-xl"></i>
                            </button>
                            <div className="h-6 w-px bg-gray-700"></div>
                            
                            {/* Tools */}
                            <div className="flex bg-gray-800 rounded-lg p-1 space-x-1">
                                <ToolBtn icon="ph-cursor" active={tool==='select'} onClick={() => setTool('select')} title="Select" />
                                <ToolBtn icon="ph-pencil-simple" active={tool==='pencil'} onClick={() => setTool('pencil')} title={t('tool_pencil')} />
                                <ToolBtn icon="ph-arrow-right" active={tool==='arrow'} onClick={() => { addArrow(); }} title={t('tool_arrow')} />
                                <ToolBtn icon="ph-square" active={tool==='rect'} onClick={() => { addRect(); }} title={t('tool_rect')} />
                                <ToolBtn icon="ph-circle" active={tool==='circle'} onClick={() => { addCircle(); }} title={t('tool_circle')} />
                                <ToolBtn icon="ph-text-t" active={tool==='text'} onClick={() => { addText(); }} title={t('tool_text')} />
                            </div>

                            {/* Colors */}
                            <div className="flex bg-gray-800 rounded-lg p-1 space-x-1">
                                <ColorBtn color="#ef4444" active={color==='#ef4444'} onClick={() => setColor('#ef4444')} title={t('color_red')} />
                                <ColorBtn color="#eab308" active={color==='#eab308'} onClick={() => setColor('#eab308')} title={t('color_yellow')} />
                                <ColorBtn color="#3b82f6" active={color==='#3b82f6'} onClick={() => setColor('#3b82f6')} title={t('color_blue')} />
                            </div>
                            
                            <div className="flex bg-gray-800 rounded-lg p-1 space-x-1">
                                <button onClick={undo} className="text-gray-400 hover:text-white px-2 rounded hover:bg-gray-700" title={t('tool_undo')}>
                                    <i className="ph ph-arrow-u-up-left text-xl"></i>
                                </button>
                                <button onClick={deleteSelected} className="text-gray-400 hover:text-red-500 px-2 rounded hover:bg-gray-700" title="Delete Selected">
                                    <i className="ph ph-trash text-xl"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div className="flex items-center space-x-4">
                            <button 
                                onClick={save} 
                                disabled={isSaving}
                                className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium flex items-center space-x-2 disabled:opacity-50"
                            >
                                {isSaving && <i className="ph ph-spinner animate-spin"></i>}
                                <span>{t('save_annotation')}</span>
                            </button>
                        </div>
                    </div>
                    
                    {/* Canvas Container */}
                    <div className="flex-1 overflow-auto flex items-center justify-center bg-[#2d2a26] p-4">
                        <div className="bg-white shadow-2xl">
                            <canvas ref={canvasEl} width={canvasSize.width} height={canvasSize.height} />
                        </div>
                    </div>
                </div>
            );
        }

        function ToolBtn({ icon, active, onClick, title }) {
            return (
                <button 
                    onClick={onClick}
                    className={`p-2 rounded transition-colors ${active ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white hover:bg-gray-700'}`}
                    title={title}
                >
                    <i className={`ph ${icon} text-xl`}></i>
                </button>
            );
        }

        function ColorBtn({ color, active, onClick, title }) {
            return (
                <button 
                    onClick={onClick}
                    className={`w-8 h-8 rounded flex items-center justify-center transition-transform ${active ? 'scale-110 ring-2 ring-white' : 'hover:scale-105'}`}
                    style={{ backgroundColor: color }}
                    title={title}
                >
                    {active && <i className="ph ph-check text-white text-xs mix-blend-difference"></i>}
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
