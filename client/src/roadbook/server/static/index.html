<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadbook Explorer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        /* Roadbook Theme Colors */
        :root {
            --bg-paper: #f8f5f0;
            --bg-paper-dark: #eee8dc;
            --text-ink: #2d2a26;
            --accent-gold: #cfa562;
            --accent-blue: #4f46e5;
            --border-color: #e5e0d6;
        }
        
        body {
            background-color: var(--bg-paper);
            color: var(--text-ink);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        .paper-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .notebook-line {
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 100% 2rem;
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">
    <div id="root" class="h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { MapTrifold, FloppyDisk, FolderOpen, Plus, Trash, ArrowRight, CaretRight, CaretDown, Image, Path } = window;

        // API Client
        const api = {
            getConfig: () => fetch('/api/config').then(res => res.json()),
            changeDir: (path) => fetch('/api/chdir', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path })
            }).then(res => res.json()),
            list: () => fetch('/api/roadbooks').then(res => res.json()),
            get: (filename) => fetch(`/api/roadbooks/${encodeURIComponent(filename)}`).then(res => res.json()),
            save: (filename, data) => fetch(`/api/roadbooks/${encodeURIComponent(filename)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => res.json()),
            upload: async (file, currentFile) => {
                const formData = new FormData();
                formData.append('file', file);
                const url = currentFile ? `/api/upload?path=${encodeURIComponent(currentFile)}` : '/api/upload';
                const res = await fetch(url, {
                    method: 'POST',
                    body: formData,
                });
                if (!res.ok) throw new Error('Upload failed');
                return await res.json();
            }
        };

        function App() {
            const [config, setConfig] = useState({ work_dir: '' });
            const [files, setFiles] = useState([]);
            const [currentFile, setCurrentFile] = useState(null);
            const [roadbook, setRoadbook] = useState(null);
            const [loading, setLoading] = useState(false);
            const [saving, setSaving] = useState(false);
            const [msg, setMsg] = useState(null);
            const [editingDir, setEditingDir] = useState(false);
            const [newDir, setNewDir] = useState('');

            // Check URL params on mount
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const fileToOpen = params.get('open');
                
                api.getConfig().then(cfg => {
                    setConfig(cfg);
                    setNewDir(cfg.work_dir);
                    loadFiles().then(() => {
                        if (fileToOpen) {
                            // Decode if needed, though URLSearchParams handles it mostly
                            loadRoadbook(fileToOpen);
                        }
                    });
                });
            }, []);

            const loadFiles = () => {
                return api.list().then(data => setFiles(data.files));
            };

            const changeDirectory = () => {
                if (!newDir) return;
                api.changeDir(newDir).then(res => {
                    setConfig(prev => ({ ...prev, work_dir: res.work_dir }));
                    setEditingDir(false);
                    setFiles([]);
                    setCurrentFile(null);
                    setRoadbook(null);
                    loadFiles();
                    setMsg({ type: 'success', text: 'Directory changed' });
                }).catch(err => {
                    setMsg({ type: 'error', text: err.message });
                });
            };

            const loadRoadbook = (filename) => {
                setLoading(true);
                setCurrentFile(filename);
                // Update URL without reload
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('open', filename);
                window.history.pushState({}, '', newUrl);

                api.get(filename).then(data => {
                    setRoadbook(data);
                    setLoading(false);
                }).catch(err => {
                    console.error(err);
                    setLoading(false);
                    setMsg({ type: 'error', text: '加载失败: ' + err.message });
                });
            };

            const saveRoadbook = () => {
                if (!currentFile || !roadbook) return;
                setSaving(true);
                api.save(currentFile, roadbook).then(() => {
                    setSaving(false);
                    setMsg({ type: 'success', text: '已保存到本地' });
                    setTimeout(() => setMsg(null), 3000);
                }).catch(err => {
                    setSaving(false);
                    setMsg({ type: 'error', text: '保存失败: ' + err.message });
                });
            };

            const updateMeta = (key, value) => {
                setRoadbook(prev => ({
                    ...prev,
                    meta: { ...prev.meta, [key]: value }
                }));
            };

            const updateSheet = (index, newSheet) => {
                const newSheets = [...roadbook.sheets];
                newSheets[index] = newSheet;
                setRoadbook(prev => ({ ...prev, sheets: newSheets }));
            };
            
            const addSheet = () => {
                let newId;
                do {
                    newId = Math.random().toString(36).substring(2, 7);
                } while (roadbook.sheets.some(s => s.id === newId));

                const newSheet = {
                    title: "新的一页",
                    id: newId,
                    steps: [],
                    extra_content: ""
                };
                setRoadbook(prev => ({
                    ...prev,
                    sheets: [...prev.sheets, newSheet]
                }));
            };

            const deleteSheet = (index) => {
                if(!confirm("确定要撕掉这一页手稿吗？")) return;
                const newSheets = [...roadbook.sheets];
                newSheets.splice(index, 1);
                setRoadbook(prev => ({ ...prev, sheets: newSheets }));
            };

            return (
                <div className="flex h-full text-sm">
                    {/* Sidebar */}
                    <div className="w-64 bg-[#eee8dc] border-r border-[#e5e0d6] flex flex-col shadow-inner">
                        <div className="p-4 border-b border-[#e5e0d6]">
                            <div className="flex items-center space-x-2 text-[#2d2a26] font-bold text-lg mb-1">
                                <i className="ph ph-map-trifold text-xl"></i>
                                <span>Roadbook Explorer</span>
                            </div>
                            
                            {/* Directory Switcher */}
                            <div className="mt-4">
                                <div className="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">工作区</div>
                                {editingDir ? (
                                    <div className="flex items-center space-x-1">
                                        <input 
                                            type="text" 
                                            value={newDir}
                                            onChange={e => setNewDir(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && changeDirectory()}
                                            className="w-full text-xs px-2 py-1 border rounded bg-white"
                                            autoFocus
                                        />
                                        <button onClick={changeDirectory} className="text-blue-600">✓</button>
                                        <button onClick={() => setEditingDir(false)} className="text-gray-500">✕</button>
                                    </div>
                                ) : (
                                    <div 
                                        className="text-xs text-gray-700 bg-white/50 px-2 py-1 rounded cursor-pointer hover:bg-white truncate border border-transparent hover:border-gray-300 transition-colors"
                                        onClick={() => setEditingDir(true)}
                                        title={config.work_dir}
                                    >
                                        {config.work_dir ? config.work_dir.split(/[\\/]/).pop() : '...'}
                                    </div>
                                )}
                            </div>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-2 space-y-1">
                            {files.length === 0 && (
                                <div className="text-center text-gray-400 mt-10 text-xs">
                                    暂无路书<br/>(Create one via CLI)
                                </div>
                            )}
                            {files.map(file => (
                                <div 
                                    key={file} 
                                    onClick={() => loadRoadbook(file)}
                                    className={`px-3 py-2 rounded-lg cursor-pointer flex items-center space-x-2 transition-all ${
                                        currentFile === file 
                                        ? 'bg-white shadow text-blue-600 font-medium' 
                                        : 'hover:bg-white/60 text-gray-700'
                                    }`}
                                >
                                    <i className="ph ph-book-bookmark text-lg opacity-70"></i>
                                    <span className="truncate">{file}</span>
                                </div>
                            ))}
                        </div>
                        
                        <div className="p-4 border-t border-[#e5e0d6] text-xs text-gray-400 text-center">
                            AARP v4.0 Protocol
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col bg-[#f8f5f0] h-full overflow-hidden relative">
                        {/* Header */}
                        <div className="h-16 bg-white/80 backdrop-blur border-b border-[#e5e0d6] px-8 flex items-center justify-between shadow-sm z-10 shrink-0">
                            <div>
                                <h1 className="font-serif font-bold text-xl text-[#2d2a26] flex items-center">
                                    {roadbook ? roadbook.meta.name || 'Untitled Roadbook' : '欢迎使用'}
                                </h1>
                                {currentFile && <div className="text-xs text-gray-400 mt-0.5 font-mono">{currentFile}</div>}
                            </div>
                            
                            <div className="flex items-center space-x-4">
                                {msg && (
                                    <span className={`text-sm px-3 py-1 rounded-full ${msg.type === 'error' ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`}>
                                        {msg.text}
                                    </span>
                                )}
                                <button 
                                    onClick={saveRoadbook} 
                                    disabled={!currentFile || saving}
                                    className={`flex items-center space-x-2 px-5 py-2 rounded-lg text-white font-medium transition-all shadow-md active:scale-95 ${
                                        !currentFile ? 'bg-gray-300 cursor-not-allowed' : 
                                        saving ? 'bg-blue-400' : 'bg-[#2d2a26] hover:bg-black'
                                    }`}
                                >
                                    <i className="ph ph-floppy-disk text-lg"></i>
                                    <span>{saving ? '保存中...' : '保存'}</span>
                                </button>
                            </div>
                        </div>

                        {/* Editor Area - Fixed Scrolling */}
                        <div className="flex-1 overflow-y-auto p-8 scroll-smooth">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center h-64 text-gray-400">
                                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-400 mb-4"></div>
                                    <span>正在翻阅手稿...</span>
                                </div>
                            ) : roadbook ? (
                                <div className="max-w-4xl mx-auto space-y-10 pb-32">
                                    
                                    {/* Meta Section */}
                                    <div className="bg-white rounded-xl shadow-sm border border-[#e5e0d6] p-8 relative overflow-hidden group">
                                        <div className="absolute top-0 left-0 w-1 h-full bg-[#2d2a26]"></div>
                                        <div className="absolute top-4 right-4 opacity-10 text-6xl text-gray-400 font-serif font-bold pointer-events-none">META</div>
                                        
                                        <div className="grid grid-cols-12 gap-6">
                                            <div className="col-span-12 mb-2">
                                                <h2 className="text-lg font-bold text-gray-800 border-b-2 border-gray-100 pb-2 inline-block">基础信息</h2>
                                            </div>
                                            
                                            <Field label="ID" value={roadbook.meta.id} onChange={v => updateMeta('id', v)} readOnly col="col-span-4" />
                                            <Field label="Name" value={roadbook.meta.name} onChange={v => updateMeta('name', v)} required col="col-span-6" />
                                            <Field label="Ver" value={roadbook.meta.version} onChange={v => updateMeta('version', v)} required col="col-span-2" />
                                            
                                            <Field label="Description" value={roadbook.meta.description} onChange={v => updateMeta('description', v)} col="col-span-12" textarea />
                                        </div>
                                    </div>

                                    {/* Sheets Section */}
                                    <div className="space-y-8">
                                        <div className="flex items-center justify-between px-2 border-b border-gray-200 pb-4">
                                            <h2 className="text-2xl font-serif font-bold text-[#2d2a26]">旅程手稿 (Sheets)</h2>
                                            <button 
                                                onClick={addSheet} 
                                                className="flex items-center space-x-1 text-blue-600 hover:text-blue-800 font-medium px-3 py-1.5 rounded hover:bg-blue-50 transition-colors"
                                            >
                                                <i className="ph ph-plus-circle text-lg"></i>
                                                <span>添加新页</span>
                                            </button>
                                        </div>
                                        
                                        {roadbook.sheets.map((sheet, idx) => (
                                            <SheetEditor 
                                                key={idx} 
                                                index={idx}
                                                sheet={sheet} 
                                                currentFile={currentFile}
                                                onChange={(newSheet) => updateSheet(idx, newSheet)}
                                                onDelete={() => deleteSheet(idx)}
                                            />
                                        ))}
                                        
                                        <div className="py-10 text-center">
                                            <button onClick={addSheet} className="text-gray-400 hover:text-blue-600 transition-colors flex flex-col items-center mx-auto space-y-2 group">
                                                <div className="w-12 h-12 rounded-full border-2 border-dashed border-gray-300 group-hover:border-blue-400 flex items-center justify-center">
                                                    <i className="ph ph-plus text-xl"></i>
                                                </div>
                                                <span className="text-sm">继续书写旅程...</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex flex-col items-center justify-center h-full text-gray-400">
                                    <i className="ph ph-book-open text-6xl mb-4 opacity-20"></i>
                                    <p>从左侧书架选择一本路书开始编辑</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Field({ label, value, onChange, required, col, textarea, placeholder, readOnly }) {
            return (
                <div className={`${col || 'col-span-12'}`}>
                    <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">
                        {label} {required && <span className="text-red-400">*</span>}
                    </label>
                    {textarea ? (
                        <textarea 
                            value={value || ''} 
                            onChange={e => onChange(e.target.value)}
                            readOnly={readOnly}
                            className={`w-full border border-gray-200 rounded-lg px-3 py-2.5 text-gray-800 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all resize-none h-24 ${readOnly ? 'bg-gray-100 cursor-not-allowed text-gray-500' : 'bg-gray-50'}`}
                            placeholder={placeholder}
                        />
                    ) : (
                        <input 
                            type="text" 
                            value={value || ''} 
                            onChange={e => onChange(e.target.value)}
                            readOnly={readOnly}
                            className={`w-full border border-gray-200 rounded-lg px-3 py-2 text-gray-800 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all ${readOnly ? 'bg-gray-100 cursor-not-allowed text-gray-500' : 'bg-gray-50'}`}
                            placeholder={placeholder}
                        />
                    )}
                </div>
            );
        }

        function SheetEditor({ index, sheet, currentFile, onChange, onDelete }) {
            const [isCollapsed, setIsCollapsed] = useState(false);
            const [draggedIdx, setDraggedIdx] = useState(null);
            const [dragOverIdx, setDragOverIdx] = useState(null);
            const [uploadingImage, setUploadingImage] = useState(false);
            const [showImageModal, setShowImageModal] = useState(false);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && showImageModal) {
                        setShowImageModal(false);
                    }
                };
                if (showImageModal) {
                    document.addEventListener('keydown', handleKeyDown);
                }
                return () => document.removeEventListener('keydown', handleKeyDown);
            }, [showImageModal]);

            const updateField = (key, value) => {
                onChange({ ...sheet, [key]: value });
            };

            const updateStep = (idx, newStep) => {
                const newSteps = [...sheet.steps];
                newSteps[idx] = newStep;
                onChange({ ...sheet, steps: newSteps });
            };

            const addStep = () => {
                onChange({
                    ...sheet,
                    steps: [...sheet.steps, { action: 'CLICK', selector: '', value: '', original_text: 'CLICK ""' }]
                });
            };

            const insertStep = (idx) => {
                const newSteps = [...sheet.steps];
                newSteps.splice(idx + 1, 0, { action: 'CLICK', selector: '', value: '', original_text: 'CLICK ""' });
                onChange({ ...sheet, steps: newSteps });
            };
            
            const removeStep = (idx) => {
                const newSteps = [...sheet.steps];
                newSteps.splice(idx, 1);
                onChange({ ...sheet, steps: newSteps });
            };

            const handleDragStart = (e, idx) => {
                setDraggedIdx(idx);
                e.dataTransfer.effectAllowed = "move";
                // 使用 setTimeout 让拖拽的本体变半透明，而不是原地的元素
                setTimeout(() => e.target.classList.add('opacity-40'), 0);
            };

            const handleDragEnd = (e) => {
                e.target.classList.remove('opacity-40');
                setDraggedIdx(null);
                setDragOverIdx(null);
            };

            const handleDragOver = (e, idx) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                if (draggedIdx === null || draggedIdx === idx) return;
                
                // 计算鼠标是在元素的上半部分还是下半部分
                const rect = e.currentTarget.getBoundingClientRect();
                const midY = rect.top + rect.height / 2;
                const isBottomHalf = e.clientY > midY;
                
                // 决定插入的视觉位置
                if (isBottomHalf) {
                    setDragOverIdx(idx + 1);
                } else {
                    setDragOverIdx(idx);
                }
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
            };

            const handleDrop = (e, idx) => {
                e.preventDefault();
                if (draggedIdx === null) return;
                
                const targetIdx = dragOverIdx !== null ? dragOverIdx : idx;
                
                if (draggedIdx === targetIdx || draggedIdx === targetIdx - 1) {
                    setDraggedIdx(null);
                    setDragOverIdx(null);
                    return;
                }
                
                const newSteps = [...sheet.steps];
                const draggedStep = newSteps[draggedIdx];
                newSteps.splice(draggedIdx, 1);
                
                // 调整插入位置，因为删除了一个元素后，后面的索引会前移
                let finalInsertIdx = targetIdx;
                if (draggedIdx < targetIdx) {
                    finalInsertIdx -= 1;
                }
                
                newSteps.splice(finalInsertIdx, 0, draggedStep);
                
                onChange({ ...sheet, steps: newSteps });
                setDraggedIdx(null);
                setDragOverIdx(null);
            };

            const handlePaste = async (e) => {
                const items = e.clipboardData ? e.clipboardData.items : null;
                if (!items) return;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        e.preventDefault();
                        const file = items[i].getAsFile();
                        const ext = file.name.split('.').pop() || 'png';
                        const newName = `img_${Math.random().toString(36).substring(2, 8)}.${ext}`;
                        const renamedFile = new File([file], newName, { type: file.type });
                        
                        setUploadingImage(true);
                        try {
                            const res = await api.upload(renamedFile, currentFile);
                            updateField('reference', `![Image](${res.url})`);
                        } catch (err) {
                            alert('图片上传失败: ' + err.message);
                        } finally {
                            setUploadingImage(false);
                        }
                        break;
                    }
                }
            };

            let previewUrl = '';
            if (sheet.reference) {
                const match = sheet.reference.match(/\((.*?)\)/);
                if (match) {
                    let extractedUrl = match[1];
                    
                    if (extractedUrl.startsWith('http://') || extractedUrl.startsWith('https://')) {
                        previewUrl = extractedUrl;
                    } else if (extractedUrl.startsWith('/')) {
                        previewUrl = extractedUrl;
                    } else {
                        // 相对路径，例如 ./assets/img.png
                        let baseDir = '';
                        if (currentFile && currentFile.includes('/')) {
                            baseDir = currentFile.substring(0, currentFile.lastIndexOf('/') + 1);
                        }
                        
                        let cleanUrl = extractedUrl;
                        if (cleanUrl.startsWith('./')) {
                            cleanUrl = cleanUrl.substring(2);
                        }
                        
                        previewUrl = `/api/files/${baseDir}${cleanUrl}`;
                    }
                }
            }

            return (
                <div className="bg-white rounded-xl shadow-sm border border-[#e5e0d6] overflow-hidden transition-all hover:shadow-md group">
                    {/* Sheet Header */}
                    <div 
                        className="bg-gradient-to-r from-gray-50 to-white px-6 py-4 border-b border-[#e5e0d6] flex justify-between items-center cursor-pointer select-none"
                        onClick={() => setIsCollapsed(!isCollapsed)}
                    >
                        <div className="flex items-center space-x-4 flex-1">
                            <div className="w-8 h-8 rounded-full bg-[#2d2a26] text-white flex items-center justify-center font-serif font-bold shrink-0">
                                {index + 1}
                            </div>
                            <div className="flex-1">
                                <input 
                                    type="text" 
                                    value={sheet.title} 
                                    onChange={e => { e.stopPropagation(); updateField('title', e.target.value); }}
                                    className="font-bold text-lg bg-transparent border-none focus:ring-0 p-0 w-full placeholder-gray-400 text-[#2d2a26]"
                                    placeholder="场景标题 (例如: 登录页面)"
                                    onClick={e => e.stopPropagation()}
                                />
                                <div className="text-xs text-gray-400 mt-0.5 font-mono">ID: {sheet.id || 'N/A'}</div>
                            </div>
                        </div>
                        <div className="flex items-center space-x-3">
                            <button 
                                onClick={(e) => { e.stopPropagation(); onDelete(); }} 
                                className="w-8 h-8 rounded-full hover:bg-red-50 text-gray-300 hover:text-red-500 flex items-center justify-center transition-colors"
                                title="删除此页"
                            >
                                <i className="ph ph-trash text-lg"></i>
                            </button>
                            <i className={`ph ph-caret-down text-gray-400 transition-transform ${isCollapsed ? '-rotate-90' : ''}`}></i>
                        </div>
                    </div>

                    {/* Sheet Body */}
                    {!isCollapsed && (
                        <div className="p-6 space-y-6">
                            <div className="grid grid-cols-2 gap-6">
                                <Field 
                                    label="URL (Optional)" 
                                    value={sheet.url} 
                                    onChange={v => updateField('url', v)} 
                                    placeholder="留空则继承上一页 URL (用于定位)" 
                                />
                                <Field 
                                    label="Locators (Optional)" 
                                    value={sheet.locators} 
                                    onChange={v => updateField('locators', v)} 
                                    placeholder='text="Login"'
                                />
                            </div>
                            
                            <Field 
                                label="Description (Goal)" 
                                value={sheet.description} 
                                onChange={v => updateField('description', v)} 
                                textarea 
                                placeholder="描述这一页的主要任务目标..."
                            />
                            
                            {/* Reference Image */}
                            <div className="bg-gray-50 rounded-lg p-4 border border-dashed border-gray-300" onPaste={handlePaste}>
                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 flex items-center justify-between">
                                    <span>Reference Image (Optional)</span>
                                    {uploadingImage && <span className="text-blue-500 normal-case text-xs"><i className="ph ph-spinner animate-spin inline-block mr-1"></i>上传中...</span>}
                                </label>
                                <div className="flex items-start space-x-4">
                                    <div className="flex-1">
                                        <input 
                                            type="text" 
                                            value={sheet.reference || ''} 
                                            onChange={e => updateField('reference', e.target.value)}
                                            className="w-full border border-gray-300 rounded px-3 py-2 text-sm font-mono text-gray-600 mb-2"
                                            placeholder="支持 Markdown 语法或直接在此处 Ctrl+V 粘贴图片"
                                        />
                                        <p className="text-xs text-gray-400">支持直接按 Ctrl+V / Cmd+V 粘贴剪贴板图片。</p>
                                    </div>
                                    {previewUrl && (
                                        <div className="w-72 bg-white rounded overflow-hidden relative group-image border border-gray-300 shadow-sm transition-all hover:shadow-md">
                                            <img 
                                                src={previewUrl} 
                                                className="w-full h-auto object-contain cursor-zoom-in"
                                                onError={(e) => e.target.style.display = 'none'} 
                                                onClick={() => setShowImageModal(true)}
                                                title="点击放大预览"
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Fullscreen Image Modal */}
                            {showImageModal && previewUrl && (
                                <div 
                                    className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-8"
                                    onClick={() => setShowImageModal(false)}
                                >
                                    <div className="relative max-w-full max-h-full">
                                        <img 
                                            src={previewUrl} 
                                            className="max-w-full max-h-[90vh] object-contain rounded shadow-2xl"
                                            onClick={(e) => e.stopPropagation()}
                                        />
                                        <button 
                                            className="absolute -top-12 right-0 text-white/70 hover:text-white transition-colors"
                                            onClick={() => setShowImageModal(false)}
                                            title="关闭预览 (Esc)"
                                        >
                                            <i className="ph ph-x text-3xl"></i>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Steps */}
                            <div>
                                <div className="flex items-center justify-between mb-3">
                                    <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider">
                                        Action Steps
                                    </label>
                                </div>
                                <div className="space-y-2 relative">
                                    {sheet.steps.map((step, idx) => (
                                        <React.Fragment key={idx}>
                                            {/* 拖拽时的顶部占位符 */}
                                            {dragOverIdx === idx && (
                                                <div className="h-1 bg-blue-400 rounded-full my-1 transition-all"></div>
                                            )}
                                            <StepEditor 
                                                index={idx} 
                                                step={step} 
                                                isDragging={draggedIdx === idx}
                                                onChange={(s) => updateStep(idx, s)} 
                                                onRemove={() => removeStep(idx)}
                                                onInsert={() => insertStep(idx)}
                                                onDragStart={(e) => handleDragStart(e, idx)}
                                                onDragOver={(e) => handleDragOver(e, idx)}
                                                onDragLeave={handleDragLeave}
                                                onDrop={(e) => handleDrop(e, idx)}
                                                onDragEnd={handleDragEnd}
                                            />
                                        </React.Fragment>
                                    ))}
                                    {/* 拖拽到最后的底部占位符 */}
                                    {dragOverIdx === sheet.steps.length && (
                                        <div className="h-1 bg-blue-400 rounded-full my-1 transition-all"></div>
                                    )}
                                    
                                    <button 
                                        onClick={addStep}
                                        className="w-full py-3 border-2 border-dashed border-gray-200 rounded-lg text-gray-400 hover:border-blue-400 hover:text-blue-500 hover:bg-blue-50 text-sm font-medium transition-all flex items-center justify-center space-x-2"
                                    >
                                        <i className="ph ph-plus"></i>
                                        <span>Add Action Step</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StepEditor({ index, step, isDragging, onChange, onRemove, onInsert, onDragStart, onDragOver, onDragLeave, onDrop, onDragEnd }) {
            return (
                <div 
                    draggable="true"
                    onDragStart={onDragStart}
                    onDragOver={onDragOver}
                    onDragLeave={onDragLeave}
                    onDrop={onDrop}
                    onDragEnd={onDragEnd}
                    className={`flex items-center space-x-3 group bg-white border rounded-lg p-2 transition-all ${
                        isDragging ? 'opacity-40 border-dashed border-gray-400 scale-[0.98]' : 'border-gray-200 hover:border-blue-300 hover:shadow-sm'
                    }`}
                >
                    <div className="cursor-grab text-gray-300 hover:text-gray-600 px-1 opacity-0 group-hover:opacity-100" title="拖动排序">
                        <i className="ph ph-dots-six-vertical text-lg"></i>
                    </div>
                    <span className="text-gray-400 font-mono w-4 text-center text-xs">{index + 1}.</span>
                    <input 
                        type="text" 
                        value={step.original_text || ''} 
                        onChange={e => onChange({ ...step, original_text: e.target.value })}
                        className="flex-1 bg-transparent border-none p-0 font-mono text-sm text-[#2d2a26] focus:ring-0 placeholder-gray-300"
                        placeholder='ACTION "Selector" "Value"'
                    />
                    <div className="opacity-0 group-hover:opacity-100 flex items-center space-x-1 px-1">
                        <button 
                            onClick={onInsert}
                            className="text-gray-300 hover:text-blue-500 transition-colors p-1"
                            title="在此前插入步骤"
                        >
                            <i className="ph ph-plus"></i>
                        </button>
                        <button 
                            onClick={onRemove}
                            className="text-gray-300 hover:text-red-500 transition-colors p-1"
                            title="删除步骤"
                        >
                            <i className="ph ph-x"></i>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
