[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roadbook"
version = "0.1.4"
description = "AI-Agent Roadbook CLI"
readme = "README.md"
authors = [
  { name = "Roadbook Team", email = "author@example.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml",
    "rich",  # For pretty output
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
    "requests",
    "python-dotenv",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[project.scripts]
roadbook = "roadbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
