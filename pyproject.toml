[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roadbook"
version = "0.2.5"
description = "AI-Agent Roadbook CLI"
readme = "README.md"
authors = [
  { name = "Roadbook Team", email = "gtvolcano@gmail.com" },
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml",
    "rich",  # For pretty output
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
    "requests",
    "python-dotenv",
    "psutil",
    "jsonschema",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[project.scripts]
roadbook = "roadbook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
